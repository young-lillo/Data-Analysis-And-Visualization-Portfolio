services:
  postgres:
    image: postgres:16-alpine
    container_name: fvsd-postgres
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/sql:/sql:ro
      - ./docs/assets/exports:/seed:ro
    expose:
      - "5432"
    networks:
      - fvsd-internal
      - metabase-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: fvsd-metabase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseapp
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: postgres
      MB_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    networks:
      - fvsd-internal
      - metabase-shared

volumes:
  postgres-data:

networks:
  fvsd-internal:
    name: fvsd-internal
  metabase-shared:
    name: metabase-shared
